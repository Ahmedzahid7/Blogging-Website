name: validate

on:
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v4
      - run: npm install htmlhint stylelint stylelint-config-standard
      - run: npx htmlhint "src/**/*.html"
      - run: npx stylelint "styles/**/*.css"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v4
      - run: npm install -D parcel
      - run: npx parcel build src/index.html --dist-dir build
